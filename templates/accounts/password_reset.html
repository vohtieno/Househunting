<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900">Forgot Password</h1>
    <p class="text-sm text-slate-600 mt-1">Enter your registered email address and we will send you a reset link.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-700">Email Address</label>
        <input type="email" name="email" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">
        Send Reset Link
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      <a href="{% url 'accounts:login' %}" class="text-emerald-600 hover:underline">Back to Login</a>
    </p>
  </div>
</body>
</html>

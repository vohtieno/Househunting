<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
    <p class="text-sm text-slate-500 mt-1">Sign in to your Househunting account.</p>

    {% if messages %}
      <div class="mt-4 space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-lg text-sm bg-amber-50 text-amber-800 border border-amber-200">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-sm font-medium text-slate-700">Username</label>
        <input type="text" name="username" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="block text-sm font-medium text-slate-700">Password</label>
          <a href="{% url 'accounts:password_reset' %}" class="text-xs text-emerald-600 hover:underline">Forgot password?</a>
        </div>
        <input type="password" name="password" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>

      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">
        Log In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Don't have an account?
      <a href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="text-emerald-600 font-medium hover:underline">Sign up</a>
    </p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900">Create an Account</h1>
    <p class="text-sm text-slate-500 mt-1">How would you like to sign up?</p>

    {% if messages %}
      <div class="mt-4 space-y-2">
        {% for message in messages %}
          <div class="p-3 rounded-lg text-sm bg-amber-50 text-amber-800 border border-amber-200">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    {% if form.errors %}
      <div class="mt-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200">
        {{ form.errors }}
      </div>
    {% endif %}

    <form method="post" class="mt-5 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="role" id="id_role" value="{{ form.role.value|default:'CUSTOMER' }}">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="role-cards">
        <button type="button" data-role="CUSTOMER"
                class="role-card text-left p-4 rounded-xl border-2 transition focus:outline-none">
          <div class="text-sm font-bold text-slate-900">Customer / Tenant</div>
          <div class="text-xs text-slate-500 mt-0.5">Find & reserve vacant houses</div>
        </button>

        <button type="button" data-role="OWNER"
                class="role-card text-left p-4 rounded-xl border-2 transition focus:outline-none">
          <div class="text-sm font-bold text-slate-900">House Owner</div>
          <div class="text-xs text-slate-500 mt-0.5">List & manage your properties</div>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Username *</label>
          <input type="text" name="username" value="{{ form.username.value|default:'' }}" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Phone Number (M-Pesa) *</label>
          <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" placeholder="0712345678" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Email Address *</label>
        <input type="email" name="email" value="{{ form.email.value|default:'' }}" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      </div>

      <div id="customer-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Preferred Location</label>
          <input type="text" name="preferred_location" value="{{ form.preferred_location.value|default:'' }}" placeholder="e.g. Njoro, Nakuru"
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Monthly Budget (KES)</label>
          <input type="number" step="0.01" name="budget" value="{{ form.budget.value|default:'' }}" placeholder="15000"
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Password *</label>
          <input type="password" name="password" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Confirm Password *</label>
          <input type="password" name="confirm_password" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
      </div>

      <button type="submit" id="submit-btn"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">
        Sign Up as Customer / Tenant & Verify Email
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Already have an account?
      <a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="text-emerald-600 font-medium hover:underline">Log in</a>
    </p>
  </div>

  <script>
    const roleInput = document.getElementById("id_role");
    const roleCards = document.querySelectorAll(".role-card");
    const customerFields = document.getElementById("customer-fields");
    const submitBtn = document.getElementById("submit-btn");

    const roleLabels = {
      CUSTOMER: "Customer / Tenant",
      OWNER: "House Owner",
    };

    function selectRole(role) {
      roleInput.value = role;

      roleCards.forEach((card) => {
        const isSelected = card.dataset.role === role;
        card.classList.toggle("border-emerald-600", isSelected);
        card.classList.toggle("bg-emerald-50", isSelected);
        card.classList.toggle("border-slate-200", !isSelected);
        card.classList.toggle("bg-white", !isSelected);
      });

      customerFields.style.display = role === "CUSTOMER" ? "grid" : "none";
      submitBtn.textContent = `Sign Up as ${roleLabels[role] || "User"} & Verify Email`;
    }

    roleCards.forEach((card) => {
      card.addEventListener("click", () => selectRole(card.dataset.role));
    });

    const params = new URLSearchParams(window.location.search);
    const preselectedRole = params.get("role");
    if (preselectedRole && roleLabels[preselectedRole.toUpperCase()]) {
      selectRole(preselectedRole.toUpperCase());
    } else {
      selectRole(roleInput.value || "CUSTOMER");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    <h1 class="text-2xl font-bold text-slate-900">Password Reset Complete</h1>
    <p class="text-sm text-slate-600 mt-2">Your password has been updated. You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-6 bg-emerald-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold">
      Log In Now
    </a>
  </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Link Sent - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    <h1 class="text-2xl font-bold text-slate-900">Check Your Email</h1>
    <p class="text-sm text-slate-600 mt-2">
      If an account matches the email you entered, a password reset link has been sent.
      (During local development, check your PowerShell terminal.)
    </p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-6 text-sm font-semibold text-emerald-600 hover:underline">
      Return to Login
    </a>
  </div>
</body>
</html>

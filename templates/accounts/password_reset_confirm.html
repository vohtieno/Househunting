<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Househunting Kenya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-900">Set a New Password</h1>

    {% if validlink %}
      {% if form.errors %}
        <div class="mt-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200">
          {{ form.errors }}
        </div>
      {% endif %}

      <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-slate-700">New Password</label>
          <input type="password" name="new_password1" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Confirm New Password</label>
          <input type="password" name="new_password2" required
                 class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm">
          Update Password
        </button>
      </form>
    {% else %}
      <p class="text-sm text-red-600 mt-3">This password reset link is invalid or has already been used.</p>
      <a href="{% url 'accounts:password_reset' %}" class="inline-block mt-4 text-sm text-emerald-600 hover:underline">
        Request a new reset link
      </a>
    {% endif %}
  </div>
</body>
</html>
